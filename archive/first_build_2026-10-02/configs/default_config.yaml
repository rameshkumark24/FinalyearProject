# ============================================================
# SFR Framework — Global Configuration
# Structure-Function-Rhythm Framework for Prenatal Heart Screening
# ============================================================

experiment:
  name: "sfr_framework_main"
  seed: 42
  device: "cuda" # or "cpu"

preprocessing:
  fetal_ecg:
    notch_freq: 50.0 # 50Hz mains hum
    bandpass_low: 1.0 # Hz
    bandpass_high: 100.0 # Hz
    sampling_rate_target: 500 # Hz (common base for foundation models)
    ica_components: 4
    template_subtraction_window_ms: 120
    qrs_tolerance_ms: 50.0 # CinC 2013 evaluation window (±50ms)
    
  doppler:
    video_fps: 60
    otsu_blur_kernel: [5, 5]
    morphology_kernel_size: 3
    envelope_smoothing_window: 15
    cycle_detection_methods: ["peaks", "template", "autocorr"]

experts:
  rhythm:
    foundation_models:
      - name: "ECGFounder"
        repo: "Li-Lab/ECGFounder" # or Hugging Face equivalent
        expected_sample_rate: 500
        leads: 1
      - name: "ECG-FM"
        repo: "wanglab/ecg-fm"
        expected_sample_rate: 500
        leads: 1
      - name: "HuBERT-ECG"
        repo: "coppola/hubert-ecg"
        expected_sample_rate: 500
        leads: 1
    baselines:
      - "hrv_logistic_regression"
      - "hrv_random_forest"
      - "cnn1d_from_scratch" # baseline only
    split_strategy: "leave_one_subject_out" # strict subject-level split

  function:
    parameters:
      - "cycle_length_ms"
      - "e_a_ratio"
      - "av_interval_ms"
      - "ejection_time_ms"
      - "qrs_to_ejection_delay_ms"
    z_score_threshold: 2.0 # ±2 standard deviations flags abnormality
    gestational_age_range: [21, 27] # NInFEA gestational weeks

  structure:
    primary_model: "FetalCLIP"
    lora:
      rank: 8
      alpha: 16
      dropout: 0.1
      target_modules: ["q_proj", "v_proj"]
    views:
      - "4CH" # Four Chamber View
      - "3VT" # Three Vessels and Trachea
      - "LVOT" # Left Ventricular Outflow Tract
      - "RVOT" # Right Ventricular Outflow Tract
    baselines:
      - "resnet50"
      - "vit_b_16"
      - "dinov2_vitb14"
      - "biomedclip"

trust_check:
  hr_difference_threshold_bpm: 10.0 # |HR_ECG - HR_Doppler| > 10 triggers mistrust
  cross_corr_threshold: 0.65
  uncertainty_penalty_factor: 1.5 # Multiplier on expert uncertainty if trust check fails

fusion:
  methods:
    - "subjective_logic_or" # Primary headline contribution
    - "max_rule"
    - "noisy_or"
    - "dempster_shafer"
    - "logistic_stacker"
  subjective_logic:
    evidence_weight: 2.0 # Dirichlet hyperparameter W
    referral_belief_threshold: 0.5 # High belief of CHD -> Refer
    uncertainty_retest_threshold: 0.4 # High uncertainty -> Request 2nd test
